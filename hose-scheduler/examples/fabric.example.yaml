# Source config for pulling live data from Microsoft Fabric through an MCP server.
#
# Nothing here is guessed: fill it in from YOUR server.
#   1. hosesched mcp-tools examples/fabric.example.yaml     -> lists the tools the server offers
#   2. point each table at a tool (and its arguments) below
#   3. hosesched mcp-test  examples/fabric.example.yaml     -> fetches and validates every table
#   4. hosesched run       examples/fabric.example.yaml     -> builds the schedule from live data
#
# Secrets never go in this file. Use ${ENV_VAR} (expanded only inside `server:`).

server:
  transport: http                        # http (streamable HTTP) or stdio
  url: https://YOUR-FABRIC-MCP-ENDPOINT/mcp
  headers:
    Authorization: "Bearer ${FABRIC_MCP_TOKEN}"
  # Or fetch a fresh token each run instead of keeping one in an env var. The command is run
  # without a shell and must print the token. Use whatever your tenant requires, for example:
  # token_command: ["az", "account", "get-access-token", "--resource", "<your resource>", "--query", "accessToken", "-o", "tsv"]
  #
  # stdio alternative (the server runs as a local process):
  # transport: stdio
  # command: your-fabric-mcp-server
  # args: []
  # env: { SOME_SETTING: "${SOME_SETTING}" }
  timeout_seconds: 120

retries: 2

# Which column says when the Fabric data was last refreshed. The tool takes the newest value
# as "data as of", which drives the stale-data banner. Timestamps in SQL are usually UTC.
freshness:
  table: orders
  column: LAST_MODIFIED_UTC
  assume_tz: UTC                         # applied only if the values carry no timezone

tables:
  orders:
    tool: run_sql                        # <- a tool name from `mcp-tools`
    arguments:
      query: >
        SELECT WO_NUMBER, ITEM_NO, QTY_OPEN, PROMISE_DATE, HOT_FLAG, PRIORITY, KIT_READY_TS, CUSTOMER, LAST_MODIFIED_UTC
        FROM open_work_orders
        WHERE STATUS IN ('RELEASED', 'IN_PROCESS') AND DEPARTMENT = 'ASSEMBLY'
    rows_path: rows                      # where the list of rows is in the tool's result ("" = top level)
    columns:                             # Fabric column -> scheduler column
      WO_NUMBER: order_id
      ITEM_NO: part_number
      QTY_OPEN: qty
      PROMISE_DATE: due_date
      HOT_FLAG: hot                      # 1/0, true/false or Y/N all work
      PRIORITY: priority
      KIT_READY_TS: kit_ready            # Eastern local time (convert in the query)
      CUSTOMER: customer

  parts:
    tool: run_sql
    arguments:
      query: "SELECT ITEM_NO, DESCR, HOSE_FAMILY, MIN_PER_PIECE, STD_BATCH, SETUP_MIN, WORKCENTERS, PREF_WC FROM item_master"
    rows_path: rows
    columns:
      ITEM_NO: part_number
      DESCR: description
      HOSE_FAMILY: hose_type
      MIN_PER_PIECE: run_min_per_unit
      STD_BATCH: max_batch
      SETUP_MIN: setup_min
      WORKCENTERS: eligible_cells        # comma-separated cell ids
      PREF_WC: preferred_cell

  # A table does not have to come from Fabric. Keep it in a local file until it is in the lakehouse.
  cells:
    file: cells.csv                      # relative to this config file; .xlsx works too (add `sheet:`)
  changeover:
    file: changeover.csv
  overrides:
    file: overrides.csv                  # `hosesched override` appends here. Not written back to Fabric.

# Same keys as the Settings sheet (see README). Weights and fence live here, in version control.
settings:
  horizon_days: 3
  pull_ahead_days: 2
  max_data_age_min: 60
  solve_seconds: 30
