# Builds StoryBox Studio on every change to main.
#
# 0) ALWAYS: also attaches "StoryBox-single-file": one StoryBox.html you can double-click (no install, no server).
# 1) ALWAYS: attaches the finished website as a downloadable ZIP ("storybox-site") to the run.
#    Open the repo's Actions tab -> the latest run -> Artifacts. Unzip it and upload the folder to any
#    static web host (Netlify, Cloudflare Pages, ...). Works for private repositories; nothing to install.
# 2) GitHub Pages (the web address for iPads): publishes automatically when the repository is PUBLIC and
#    Settings -> Pages -> Source is "GitHub Actions". (A private repo on a paid plan can switch it on with
#    Settings -> Secrets and variables -> Actions -> Variables -> DEPLOY_PAGES = true.)
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # (0) the double-click single file
      - run: node scripts/inline-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: StoryBox-single-file
          path: standalone/StoryBox.html
          if-no-files-found: error
          retention-days: 30

      # (1) the downloadable website
      - uses: actions/upload-artifact@v4
        with:
          name: storybox-site
          path: dist
          if-no-files-found: error
          retention-days: 30

      # (2) GitHub Pages: public repo, or switched on with DEPLOY_PAGES
      - uses: actions/configure-pages@v5
        if: ${{ vars.DEPLOY_PAGES == 'true' || github.event.repository.private == false }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ vars.DEPLOY_PAGES == 'true' || github.event.repository.private == false }}
        with:
          path: dist

  deploy-pages:
    needs: build
    if: ${{ vars.DEPLOY_PAGES == 'true' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
